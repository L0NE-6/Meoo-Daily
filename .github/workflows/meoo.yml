name: 🍀 Meoo Daily

on:
  push:
    branches:
      - main
  schedule:
    # 北京时间每天约 07:17；GitHub Actions 使用 UTC，且可能延迟。
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meoo-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt ruff

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile sources
        run: python -m compileall -q .

      - name: Run Ruff
        run: python -m ruff check .

  checkin:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
      MEOO_COOKIES: ${{ secrets.MEOO_COOKIES }}
      MEOO_COOKIE: ${{ secrets.MEOO_COOKIE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "${MEOO_COOKIES:-}" ] || [ -n "${MEOO_COOKIE:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Meoo Daily::Credentials detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Meoo Daily::No MEOO_COOKIES or MEOO_COOKIE configured; scheduled check-in skipped."
          fi

      - name: Run Meoo daily login
        if: steps.credentials.outputs.available == 'true'
        id: checkin
        shell: bash
        run: |
          set +e
          python meoo_daily.py > meoo-report.jsonl
          status=$?
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("meoo-report.jsonl")
          records = [
              json.loads(line)
              for line in source.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          Path("meoo-report.json").write_text(
              json.dumps(records, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          convert_status=$?
          if [ -f meoo-report.json ]; then
            cat meoo-report.json
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$convert_status" -ne 0 ]; then
            exit "$convert_status"
          fi
          exit "$status"

      - name: Upload JSON report
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meoo-report
          path: |
            meoo-report.json
            meoo-report.jsonl
          if-no-files-found: warn
