[project]
name = "meoo-daily"
version = "1.0.0"
description = "Meoo daily login credit runner for Qinglong and GitHub Actions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31,<3",
]

[tool.ruff]
target-version = "py39"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
